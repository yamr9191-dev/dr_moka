<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2B1A4E"/>
      <stop offset="55%" stop-color="#170D2E"/>
      <stop offset="100%" stop-color="#0D071B"/>
    </radialGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F19BDC"/>
      <stop offset="50%" stop-color="#AD7BFF"/>
      <stop offset="100%" stop-color="#7B42E0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B8"/>
      <stop offset="50%" stop-color="#FFD78B"/>
      <stop offset="100%" stop-color="#E5A93B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Square -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  
  <!-- Subtle Cosmic Ring -->
  <circle cx="256" cy="268" r="185" fill="none" stroke="url(#purpleGlow)" stroke-width="3" opacity="0.25"/>
  <circle cx="256" cy="268" r="158" fill="none" stroke="#F19BDC" stroke-width="1.5" stroke-dasharray="8 10" opacity="0.3"/>

  <!-- Sparkle Stars -->
  <path d="M115 135 L120 148 L133 153 L120 158 L115 171 L110 158 L97 153 L110 148 Z" fill="#FFD78B" opacity="0.9"/>
  <path d="M395 145 L399 155 L409 159 L399 163 L395 173 L391 163 L381 159 L391 155 Z" fill="#F19BDC" opacity="0.85"/>
  <circle cx="385" cy="360" r="5" fill="#8CE6CB" opacity="0.8"/>
  <circle cx="128" cy="355" r="4" fill="#AD7BFF" opacity="0.8"/>

  <!-- Golden Crown tilted above M -->
  <g transform="translate(212, 74) rotate(-6)">
    <path d="M10 62 L6 22 L30 42 L48 12 L66 42 L90 22 L86 62 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    <rect x="10" y="66" width="76" height="9" rx="4.5" fill="url(#goldGrad)"/>
    <circle cx="6" cy="18" r="5" fill="#FFF0B8"/>
    <circle cx="48" cy="8" r="6" fill="#FFF0B8"/>
    <circle cx="90" cy="18" r="5" fill="#FFF0B8"/>
  </g>

  <!-- Stylish Letter M / Arabic Calligraphic Vibe -->
  <path d="M142 365 L142 205 C142 188 164 182 174 196 L256 305 L338 196 C348 182 370 188 370 205 L370 365" 
        fill="none" stroke="url(#purpleGlow)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Cute Pink Ribbon Bow on bottom-right -->
  <g transform="translate(348, 355) rotate(-15)">
    <path d="M0 0 C-22 -18 -34 12 -4 5 Z" fill="#F19BDC"/>
    <path d="M0 0 C22 -18 34 12 4 5 Z" fill="#F19BDC"/>
    <circle cx="0" cy="2" r="5.5" fill="#FFD78B"/>
  </g>

  <!-- Subtitle text -->
  <text x="256" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="34" letter-spacing="8" fill="#F8F1FF" opacity="0.95">MALAK</text>
</svg>